<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff0f5"><meta name="description" content="Send an anonymous message with Amora.">

<body><main class="auth-layout"><section class="auth-card" style="max-width:560px;margin:7vh auto;padding:24px">
