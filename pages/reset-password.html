<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#160d1c">
  <title>Choose a new password · Amora</title>
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/reset-password.css">
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-client.js"></script>
  <script src="/js/password-reset.js" defer></script>
</head>
<body class="reset-password-page">
  <main class="reset-password-shell">
    <a class="auth-brand reset-brand" href="/"><span class="auth-brand-mark">A</span><span>amora</span></a>
    <section class="reset-password-card">
      <p class="auth-eyebrow">ACCOUNT RECOVERY</p>
      <h1>Choose a new password</h1>
      <p class="reset-intro">You're resetting the password for the account verified by your recovery link.</p>
      <div id="recovery-account" class="recovery-account" hidden>
        <span class="recovery-account-icon">✉</span>
        <div><small>ACCOUNT EMAIL</small><strong id="recovery-account-email">Verifying account…</strong></div>
      </div>
      <form id="new-password-form" class="reset-new-password-form">
        <label for="new-password">New password</label>
        <input type="password" id="new-password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>
        <label for="confirm-new-password">Confirm new password</label>
        <input type="password" id="confirm-new-password" minlength="8" autocomplete="new-password" placeholder="Enter the password again" required>
        <button class="primary-btn" type="submit" id="save-new-password">Update password</button>
        <p id="new-password-status" role="status" aria-live="polite"></p>
        <a id="reset-login-link" class="reset-login-link" href="/pages/home.html?auth=login" hidden>Return to login</a>
      </form>
      <p class="reset-help">If this link has expired or was already used, request a new password reset email.</p>
    </section>
  </main>
</body>
</html>
